name: ASIO engine (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Scarica l'SDK ASIO dal repository privato
        uses: actions/checkout@v4
        with:
          repository: Dibbebag/asio-sdk
          token: ${{ secrets.ASIO_SDK_TOKEN }}
          path: sdk

      - name: Estrai l'SDK e trova le sorgenti
        shell: bash
        run: |
          Z=$(find sdk -name '*.zip' -not -path '*/.git/*' | head -1)
          if [ -n "$Z" ]; then 7z x "$Z" -osdkx -y > /dev/null; fi
          P=$(find sdk sdkx -name asiodrivers.cpp 2>/dev/null | head -1)
          if [ -z "$P" ]; then echo "asiodrivers.cpp non trovato nell'SDK"; exit 1; fi
          D=$(cd "$(dirname "$P")/.." && pwd)
          echo "SDK_DIR=$D" >> $GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compila asio-engine
        shell: bash
        run: |
          cd app/asio-engine
          S="$SDK_DIR"
          cl -nologo -EHsc -O2 -std:c++17 -DWIN32 -D_CONSOLE \
            "-I$S/common" "-I$S/host" "-I$S/host/pc" \
            asio-engine.cpp \
            "$S/common/asio.cpp" "$S/host/asiodrivers.cpp" "$S/host/pc/asiolist.cpp" \
            ole32.lib user32.lib uuid.lib advapi32.lib -Feasio-engine.exe

      - uses: actions/upload-artifact@v4
        with:
          name: asio-engine
          path: app/asio-engine/asio-engine.exe

name: Build APK da zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chiave di firma (creata una volta sola)
        run: |
          [ -n "$KSPASS" ] || { echo "Manca il secret KEYSTORE_PASSWORD"; exit 1; }
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -keystore release.keystore -storetype PKCS12 \
              -alias cuelist -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$KSPASS" -keypass "$KSPASS" -dname "CN=CueList"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add release.keystore
            git commit -m "Aggiunge chiave di firma"
            git push
          fi

      - name: Decomprimi lo zip
        run: |
          unzip -q cuelist-android.zip -d src
          P=$(find src -name package.json -not -path '*/node_modules/*' | head -1)
          echo "APP_DIR=$(dirname "$P")" >> $GITHUB_ENV

      - name: Inserisci numero di build
        run: sed -i "s/__BUILD__/${{ github.run_number }}/g" "$APP_DIR/www/index.html"

      - {uses: actions/setup-node@v4, with: {node-version: 20}}

      - {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: 17}}

      - name: Installa dipendenze
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Crea progetto Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compila APK release
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease

      - name: Firma APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(find "$APP_DIR/android/app/build/outputs/apk/release" -name '*.apk' | head -1)
          $BT/zipalign -p -f 4 "$IN" aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-pass env:KSPASS \
            --ks-key-alias cuelist --out cuelist.apk aligned.apk

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" cuelist.apk \
            --title "Build ${{ github.run_number }}" --notes "Build automatica"

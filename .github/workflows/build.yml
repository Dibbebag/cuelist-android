name: Build APK da zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decomprimi lo zip
        run: |
          unzip -q "$(ls *.zip | head -1)" -d src
          P=$(find src -name package.json -not -path '*/node_modules/*' | head -1)
          echo "APP_DIR=$(dirname "$P")" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa dipendenze
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Crea progetto Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Compila APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cuelist-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
